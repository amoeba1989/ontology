name: ECS read-only diagnostics
on:
  push:
    branches: [ops/ecs-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT || '22' }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
    steps:
      - name: Inspect server without changing services
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -p "$ECS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$ECS_USER@$ECS_HOST" 'sh -s' <<'REMOTE'
          set -eu
          date -u
          uptime
          free -m
          df -h / /opt/ontology
          echo '--- containers ---'
          docker ps --format '{{.Names}} {{.Status}}'
          echo '--- resource use ---'
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}'
          echo '--- process names (no arguments or environment) ---'
          ps -eo pid,ppid,etime,pcpu,pmem,comm --sort=-pcpu | head -25
          echo '--- deployment lock ---'
          if flock -n /opt/ontology/.deploy.lock -c true; then echo unlocked; else echo locked; fi
          echo '--- source revision ---'
          cat /opt/ontology/.deployment-revision
          echo '--- health ---'
          curl -s --max-time 10 -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8088/
          echo '--- MySQL local administration ---'
          if command -v mysql >/dev/null 2>&1; then
            if mysql --protocol=socket --batch --skip-column-names -e 'SELECT VERSION(); SHOW DATABASES;' 2>/dev/null; then
              echo MYSQL_LOCAL_ADMIN_READY
            else
              echo MYSQL_LOCAL_ADMIN_UNAVAILABLE
            fi
          else
            echo MYSQL_CLIENT_UNAVAILABLE
          fi
          echo '--- Platform database backend (no credentials) ---'
          docker exec ontology-backend python -c 'from app.config import settings; from app.db_engine import database_url; u=database_url(settings); print(u.get_backend_name()); print(u.database)'
          echo '--- Customer demo model diagnosis (credentials omitted) ---'
          docker exec -i ontology-backend python - <<'PY'
          import json
          from urllib.parse import urlsplit
          from app.database import SessionLocal
          from app.models import Agent, Skill, User, DeliveryProject
          from app.models.customer_demo import CustomerDemoPack
          from app.services.llm_resolver import resolve_agent_model, _create_client

          db = SessionLocal()
          try:
              pack = db.get(CustomerDemoPack, 'health')
              agent = db.get(Agent, (pack.resources or {}).get('agent_id')) if pack else None
              print('pack=', bool(pack), 'agent=', bool(agent))
              config = resolve_agent_model(db, agent)
              print('model=', config.get('model'))
              print('host=', urlsplit(config.get('base_url') or '').hostname)
              print('credential_configured=', bool(config.get('api_key')))
              skills = []
              for skill_id in (agent.tools_config or {}).get('skill_ids', []):
                  skill = db.get(Skill, skill_id)
                  if skill:
                      skills.append({'name': 'skill_' + skill.id.replace('-', ''),
                                     'description': skill.name + '：' + skill.description,
                                     'parameters': skill.input_schema or {'type': 'object', 'properties': {}, 'additionalProperties': False}})
              print('tool_count=', len(skills), 'tool_names=', [s['name'] for s in skills])
              from app.services.business_skills import run_business_skill
              for demo_pack in db.query(CustomerDemoPack).all():
                  project = db.get(DeliveryProject, demo_pack.project_id)
                  owner = db.get(User, project.owner_id) if project else None
                  from app.services.delivery import inspect_chain
                  issues, current = inspect_chain(db, project.release['config'])
                  expected = project.release
                  def differences(left, right, path=''):
                      if type(left) is not type(right):
                          yield path, type(left).__name__, type(right).__name__, repr(left)[:160], repr(right)[:160]
                      elif isinstance(left, dict):
                          for key in sorted(set(left) | set(right)):
                              if key == 'fingerprint':
                                  continue
                              if key not in left or key not in right:
                                  yield path + '/' + str(key), 'missing' if key not in left else type(left[key]).__name__, 'missing' if key not in right else type(right[key]).__name__, '', ''
                              else:
                                  yield from differences(left[key], right[key], path + '/' + str(key))
                      elif isinstance(left, list):
                          if len(left) != len(right):
                              yield path, 'list:' + str(len(left)), 'list:' + str(len(right)), '', ''
                          for index, (a, b) in enumerate(zip(left, right)):
                              yield from differences(a, b, path + '/' + str(index))
                      elif left != right:
                          yield path, type(left).__name__, type(right).__name__, repr(left)[:160], repr(right)[:160]
                  print('contract=', demo_pack.key, current['fingerprint'], expected.get('fingerprint'), 'issues=', issues)
                  print('contract_diff=', demo_pack.key, list(differences(current, expected))[:12])
                  for skill_id in (demo_pack.resources or {}).get('skill_ids', []):
                      skill = db.get(Skill, skill_id)
                      result = run_business_skill(db, skill, skill.test_cases[0]['params'], owner, 'diagnosis')
                      print('skill_check=', demo_pack.key, skill.code_ref, result.get('success'), result.get('summary'))
              client = _create_client(config['api_key'], config['base_url']).with_options(timeout=30, max_retries=0)
              try:
                  response = client.chat.completions.create(
                      model=config['model'],
                      messages=[{'role': 'user', 'content': '请调用工具读取演示数据。'}],
                      tools=[{'type': 'function', 'function': s} for s in skills],
                      tool_choice='auto', max_tokens=64,
                  )
                  message = response.choices[0].message
                  print('provider_call=PASS', 'tool_calls=', len(message.tool_calls or []))
              except Exception as exc:
                  print('provider_call=FAIL')
                  print('error_type=', type(exc).__name__)
                  print('status_code=', getattr(exc, 'status_code', None))
                  body = getattr(exc, 'body', None)
                  if isinstance(body, dict):
                      safe = {k: body.get(k) for k in ('code', 'type', 'message') if body.get(k) is not None}
                      nested = body.get('error')
                      if isinstance(nested, dict):
                          safe['error'] = {k: nested.get(k) for k in ('code', 'type', 'message') if nested.get(k) is not None}
                      print('provider_error=', json.dumps(safe, ensure_ascii=False)[:1200])
          finally:
              db.close()
          PY
          REMOTE
