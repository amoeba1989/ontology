name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ontology-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Test delivery chain and business scenarios
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest pytest-asyncio
          python -m pytest tests/test_delivery_projects.py tests/test_customer_demo.py tests/test_action_executors.py tests/test_ontology_constraints.py tests/test_ontology_impact.py -q --disable-warnings
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
          pnpm exec vite build
  deploy:
    needs: verify
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 40
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT || '22' }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          for key in ECS_HOST ECS_USER ECS_SSH_KEY ECS_KNOWN_HOSTS; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
          [[ "$ECS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$ECS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$ECS_SSH_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Synchronize source and deploy
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTIONS="-p $ECS_SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          ssh $SSH_OPTIONS "$ECS_USER@$ECS_HOST" \
            'test -d /opt/ontology && command -v rsync && command -v curl && command -v flock && docker info >/dev/null'
          # Transfer only this commit's files; never send runner credentials.
          SOURCE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SOURCE_DIR"' EXIT
          git archive HEAD | tar -x -C "$SOURCE_DIR"
          git rev-parse HEAD > "$SOURCE_DIR/.deployment-revision"
          # A server-side lock also protects manual deployments using this lock.
          # Keep the lock open throughout synchronization, build and restart.
          tar -C "$SOURCE_DIR" -czf - . | ssh $SSH_OPTIONS "$ECS_USER@$ECS_HOST" '
            set -eu
            exec 9>/opt/ontology/.deploy.lock
            flock -w 1800 9
            source_dir=$(mktemp -d)
            trap '\''rm -rf "$source_dir"'\'' EXIT
            tar -xzf - -C "$source_dir"
            rsync -a --delete \
              --exclude="/.git/" --exclude="/.deploy.lock" \
              --exclude="/data/" --exclude=".env" --exclude=".env.*" \
              --exclude="/backend/data/" --exclude="/backend/uploads/" \
              --exclude="/backend/venv/" --exclude="/.venv/" \
              --exclude="/frontend/node_modules/" --exclude="/logs/" \
              "$source_dir/" /opt/ontology/
            cd /opt/ontology
            sh scripts/deploy/deploy-docker.sh
          '

      - name: Collect production demonstration verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$ECS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$ECS_USER@$ECS_HOST" 'cat /opt/ontology/data/customer-demo-report.json' > customer-demo-report.json
          python - <<'PY'
          import json, os
          r = json.load(open('customer-demo-report.json'))
          if r.get('revision') != os.environ['GITHUB_SHA']:
              raise SystemExit('Verification report does not match this deployment')
          lines = ['## Production demonstration verification', '', '| Business pack | Database skills | Model | AI tool calling |', '|---|---|---|---|']
          for p in r['packs']:
              ai = p.get('ai', {})
              model = str(ai.get('model', '')).replace('\n', ' ').replace('|', '/')
              lines.append(f"| {p['key']} | {p['skills_passed']}/3 | {model} | {'PASS' if ai.get('passed') else 'FAIL'} |")
          lines += ['', 'Menu record counts: ' + json.dumps(r['menus'], ensure_ascii=False)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          # Basic data/skill verification gates deployment. AI is reported separately;
          # enable CHECK_AI=1 in the server environment after configuring a model to
          # make missing/failed tool-calling a hard gate.
          if not r['ok']:
              raise SystemExit('Production demonstration verification failed; see report')
          ai_passed = all(p.get('ai', {}).get('passed', True) for p in r['packs'])
          print('Production database skills: PASS; AI tool calling: ' + ('PASS' if ai_passed else 'NOT CONFIGURED/NOT VERIFIED'))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-demo-verification
          path: customer-demo-report.json
          retention-days: 14
