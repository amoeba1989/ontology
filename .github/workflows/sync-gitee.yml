name: Sync Gitee and GitHub

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ontology-gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize default branches without overwriting commits
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: amoeba1989
          GITEE_SYNC_BRANCH: ${{ vars.GITEE_SYNC_BRANCH }}
        run: |
          set -euo pipefail
          if [[ -z "$GITEE_TOKEN" ]]; then
            echo '::error::Add repository Actions secret GITEE_TOKEN (Gitee access token with repository read/write access).'
            exit 1
          fi
          askpass=$(mktemp "$RUNNER_TEMP/gitee-askpass.XXXXXX")
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git remote add gitee https://gitee.com/amoeba1989/ontology.git
          bash scripts/sync/gitee.sh
