 services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: ontology-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/ontology.db}
      - DATABASE_BACKEND=${DATABASE_BACKEND:-sqlite}
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ontology_db}
      - MYSQL_USER=${MYSQL_USER:-}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_SSL_CA=${MYSQL_SSL_CA:-}
      - DEMO_DB_DIR=/app/backend/data
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APP_BUILD_REVISION: ${APP_BUILD_REVISION:-unknown}
    container_name: ontology-web
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
